<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>FImg</title>
    </head>
    <style>
        * {
            margin: 0;
        }

        body {
            width: 100vw;
            height: 100vh;
            color: #f8f8f8;
            background: #181818;
        }

        .main {
            margin: 0 5%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .column {
            display: flex;
            flex-direction: column;
        }

        .spacer {
            flex: 1;
            width: 100%;
        }

        .controls {
            margin-top: 10px;
            display: flex;
            flex-direction: row;
            justify-content: space-between;
        }

        #canvas {
            width: 100%;
        }

        #error {
            position: absolute;
            z-index: 999;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #ce2323;
            color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            font-weight: bolder;
        }
    </style>
    <body>
        <div id="error" style="visibility: hidden"></div>
        <div class="main">
            <div class="spacer"></div>
            <canvas id="canvas"></canvas>
            <div class="spacer">
                <div class="controls">
                    <div>
                        <p>Output:</p>
                        <p id="float"></p>
                        <p id="exact"></p>
                    </div>
                </div>
            </div>
        </div>
    </body>
    <script src="index.js"></script>
</html>
