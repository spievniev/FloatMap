name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build
        run: ./build.sh

      - name: Upload
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./build

      - name: Deploy
        uses: actions/deploy-pages@v5
