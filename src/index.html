<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Float Accuracy Heatmap</title>
    </head>
    <style>
        * {
            margin: 0;
        }

        body {
            width: 100vw;
            height: 100vh;
            color: #f8f8f8;
            background: #181818;
        }

        .main {
            margin: 0 7.5%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .column {
            display: flex;
            flex-direction: column;
        }

        .spacer {
            flex: 1;
            width: 100%;
        }

        .controls {
            margin-top: 10px;
            display: flex;
            flex-direction: row;
            justify-content: space-between;
        }

        .canvasContainer {
            position: relative;
            width: 100%;
        }

        #canvas {
            display: block;
            width: 100%;
        }

        #yMin {
            position: absolute;
            line-height: 1;
            bottom: 0;
            left: 0;
            transform: translateX(-100%);
            padding-right: 2px;
        }

        #yMax {
            position: absolute;
            line-height: 1;
            top: 0;
            left: 0;
            transform: translateX(-100%);
            padding-right: 2px;
        }

        .xLabels {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            width: 100%;
            margin-top: 2px;
        }

        .label {
            font-size: 12px;
        }

        #error {
            position: absolute;
            z-index: 999;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #ce2323;
            color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            font-weight: bolder;
        }

        .center {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .row {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }

        .controlLabel {
            margin-right: 12px;
        }

        .controlRadio {
            margin-right: 4px;
        }

        #github {
            position: absolute;
            top: 12px;
            right: 12px;
        }
    </style>
    <body>
        <div id="error" style="visibility: hidden"></div>
        <a id="github" href="https://github.com/spevnev/fah" target="_blank">
            <img src="https://cdn.simpleicons.org/github/B8B8B8" width="24" height="24" />
        </a>
        <div class="main">
            <div class="spacer center">
                <h3>Float Accuracy Heatmap</h3>
            </div>
            <div class="canvasContainer">
                <canvas id="canvas"> </canvas>
                <p id="yMin" class="label">y</p>
                <p id="yMax" class="label">Y</p>
            </div>
            <div class="xLabels">
                <p id="xMin" class="label">x</p>
                <p id="xMax" class="label">X</p>
            </div>
            <div class="spacer">
                <div class="controls">
                    <div>
                        <p id="exact">Exact: -</p>
                        <p id="float">Float: -</p>
                    </div>
                    <div>
                        <div class="row">
                            <p class="controlLabel">Float type:</p>
                            <input type="radio" id="f16" name="f" class="controlRadio" />
                            <label for="f16" style="margin-right: 16px">half (16)</label>
                            <input type="radio" id="f32" name="f" class="controlRadio" />
                            <label for="f32">single (32)</label>
                        </div>
                        <div class="row">
                            <label for="brightness" class="controlLabel">Brightness:</label>
                            <input type="range" min="0.2" max="2" step="0.1" id="brightness" style="width: 100%" />
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </body>
    <script src="index.js"></script>
</html>
